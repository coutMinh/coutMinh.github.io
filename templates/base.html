<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#f6f7f9">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <title>$title</title>
  <script>try{const t=localStorage.getItem('portfolio-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch{}</script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html" aria-label="Minh Tran, home"><span class="brand-mark" aria-hidden="true">m<span>.</span></span><span>Minh Tran</span></a>
    <nav aria-label="Main navigation">$navigation</nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme" hidden>$theme_icon</button>
  </div></header>
  <main id="main" class="page-shell $page_class">$body</main>
  <dialog id="figure-dialog" aria-labelledby="figure-dialog-title"><div class="dialog-heading"><h2 id="figure-dialog-title">Paper figure</h2><button class="dialog-close" type="button" aria-label="Close figure">×</button></div><div class="dialog-image-wrap"><img id="dialog-image" alt=""></div><p id="dialog-credit"></p><a id="dialog-source" target="_blank" rel="noopener">Original source <span aria-hidden="true">↗</span></a></dialog>
</body>
</html>
